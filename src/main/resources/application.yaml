server:
  port: 4550
  shutdown: "graceful"

management:
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

spring:
  config:
    import: "optional:configtree:/mnt/secrets/dtsse/"
  application:
    name: dtsse-services
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:services}${DB_OPTIONS:}
    username: ${DB_USER_NAME:services}
    password: ${DB_PASSWORD:services}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

listassist:
  blob:
    endpoint: ${LISTASSIST_BLOB_ENDPOINT:https://mipersistentprod.blob.core.windows.net/}

azure:
  application-insights:
    instrumentation-key: ${dtsse.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}
