server:
  port: 4550
  shutdown: "graceful"

management:
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

spring:
  config:
    import: "optional:configtree:/mnt/secrets/dtsse/"
  application:
    name: dtsse-services
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:services}${DB_OPTIONS:}
    username: ${DB_USER_NAME:services}
    password: ${DB_PASSWORD:services}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    # Preview and AAT start the application alongside a fresh PostgreSQL pod
    connect-retries: 30

listassist:
  blob:
    # listassist.blob.endpoint and listassist.blob.containers.{hearings,sessions,session-officers,users} have no
    # defaults; deployments mount them from Key Vault. Without an endpoint there is no Blob access or ingestion.
    # entra (DefaultAzureCredential) or emulator (Azurite development key, emulator endpoints only)
    auth: ${LISTASSIST_BLOB_AUTH:entra}
  ingest:
    enabled: ${LISTASSIST_INGEST_ENABLED:false}
    cron: ${LISTASSIST_INGEST_CRON:0 0 3/6 * * *}
    zone: ${LISTASSIST_INGEST_ZONE:Europe/London}
    # Larger extracts fail as file_too_large before download, bounding temporary disk use.
    max-file-bytes: ${LISTASSIST_INGEST_MAX_FILE_BYTES:1073741824}
    temp-directory: ${LISTASSIST_INGEST_TEMP_DIRECTORY:${java.io.tmpdir}/dtsse-listassist}

azure:
  application-insights:
    instrumentation-key: ${dtsse.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}
