services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: services
      POSTGRES_USER: services
      POSTGRES_PASSWORD: services
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U services -d services"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
