java:
  applicationPort: 4550
  memoryRequests: 2Gi
  memoryLimits: 3Gi
  devmemoryRequests: 2Gi
  devmemoryLimits: 3Gi
  image: hmctsprod.azurecr.io/dtsse-services/api:latest
  ingressHost: dtsse-services-api-{{ .Values.global.environment }}.service.core-compute-{{ .Values.global.environment }}.internal
  environment:
    DB_HOST: dtsse-services-api-{{ .Values.global.environment }}.postgres.database.azure.com
    DB_PORT: "5432"
    DB_NAME: services
    DB_USER_NAME: pgadmin
    DB_OPTIONS: "?sslmode=require"
  keyVaults:
    dtsse-services:
      secrets:
        - name: api-POSTGRES-PASS
          alias: DB_PASSWORD
        - app-insights-connection-string
        - name: listassist-blob-endpoint
          alias: listassist.blob.endpoint
        - name: listassist-container-hearings
          alias: listassist.blob.containers.hearings
        - name: listassist-container-sessions
          alias: listassist.blob.containers.sessions
        - name: listassist-container-session-officers
          alias: listassist.blob.containers.session-officers
        - name: listassist-container-users
          alias: listassist.blob.containers.users

devPostgresql:
  enabled: false
